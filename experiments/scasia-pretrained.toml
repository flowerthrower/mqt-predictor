# Paths are relative to this TOML file. Use a shared cluster scratch directory for output.
assets = "assets"
output = "../../scasia-runs/gnn-pretrained-v4"

[experiment]
objective = "estimated_success_probability"
training_timesteps = 100000
episode_actions = 32
training_seed = 0
evaluation_seed = 0
evaluation_repetitions = 10
checkpoint_steps = 2048
reward_scale = 1.0
no_effect_penalty = -0.001
# Zero means all 41 evaluation circuits. A smaller value is for smoke tests only.
evaluation_circuits = 0

[worker]
pass_timeout_seconds = 60.0
startup_timeout_seconds = 120.0
threads = 1
bqskit_workers = 1

[original]
bqskit_port = 17472
bqskit_worker_port = 17474

[original.ppo]
learning_rate = 0.0003
n_steps = 2048
batch_size = 64
n_epochs = 10
gamma = 0.98
gae_lambda = 0.95
clip_range = 0.2
normalize_advantage = true
ent_coef = 0.0
vf_coef = 0.5
max_grad_norm = 0.5
# SB3 defaults: clip_range_vf = None, target_kl = None, two 64-unit Tanh layers.

[paper]
bqskit_port = 19472
bqskit_worker_port = 19474

[paper.gnn]
# Terminal-only ESP with no discount for longer compilations.
gamma = 1.0

[paper.warmstart]
# Continue the verified 20-epoch model directly with PPO; no teacher replay.
# Set training_timesteps = 0 to evaluate the imported model without PPO.
checkpoint = "assets/gnn-context20.zip"
epochs = 0
batch_size = 8
