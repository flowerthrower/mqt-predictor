# Fresh teacher training and evaluation for the 44-action registry.
# Paths are relative to this TOML file.
assets = "assets"
output = "../../scasia-runs/gnn-atomic-v7"

[experiment]
objective = "estimated_success_probability"
training_timesteps = 0
episode_actions = 32
training_seed = 0
evaluation_seed = 0
evaluation_repetitions = 10
checkpoint_steps = 2048
reward_scale = 1.0
no_effect_penalty = -0.001
evaluation_circuits = 0

[worker]
pass_timeout_seconds = 60.0
startup_timeout_seconds = 120.0
threads = 1
bqskit_workers = 1

[original]
bqskit_port = 27472
bqskit_worker_port = 27474

[original.ppo]
learning_rate = 0.0003
n_steps = 2048
batch_size = 64
n_epochs = 10
gamma = 0.98
gae_lambda = 0.95
clip_range = 0.2
normalize_advantage = true
ent_coef = 0.0
vf_coef = 0.5
max_grad_norm = 0.5

[paper]
bqskit_port = 28472
bqskit_worker_port = 28474
previous_action = true

[paper.gnn]
gamma = 1.0

[paper.warmstart]
# Train fresh weights; the bundled 45-action checkpoint is incompatible.
# Retain failed VF2 layout attempts so the model can learn when to try routing.
epochs = 8
batch_size = 8
