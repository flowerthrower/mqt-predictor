# Paths are relative to this TOML file. Use a shared cluster scratch directory for output.
assets = "assets"
output = "../../scasia-runs/gnn-pretrained-v6"

[experiment]
objective = "estimated_success_probability"
training_timesteps = 100000
episode_actions = 32
training_seed = 0
evaluation_seed = 0
evaluation_repetitions = 10
checkpoint_steps = 2048
reward_scale = 1.0
no_effect_penalty = -0.001
evaluation_circuits = 0

[worker]
pass_timeout_seconds = 60.0
startup_timeout_seconds = 120.0
threads = 1
bqskit_workers = 1

[original]
bqskit_port = 17472
bqskit_worker_port = 17474

[original.ppo]
learning_rate = 0.0003
n_steps = 2048
batch_size = 64
n_epochs = 10
gamma = 0.98
gae_lambda = 0.95
clip_range = 0.2
normalize_advantage = true
ent_coef = 0.0
vf_coef = 0.5
max_grad_norm = 0.5

[paper]
bqskit_port = 19472
bqskit_worker_port = 19474

[paper.gnn]
gamma = 1.0

[paper.warmstart]
checkpoint = "assets/gnn-context20.zip"
epochs = 0
batch_size = 8

[paper.refinement]
quality_features = true
action_cost = 0.0001
teacher_kl_coefficient = 0.1
